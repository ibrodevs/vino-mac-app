name: Build macOS

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build debug
        run: swift build
      - name: Build app bundle
        run: ./Scripts/build-app.sh
